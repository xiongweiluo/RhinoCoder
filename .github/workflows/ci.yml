name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install UI dependencies
        run: npm ci --prefix agent/ui
      - name: Compile
        run: python -m compileall -q agent data_pipeline eval plugin tools
      - name: Unit tests
        run: python -m pytest -q
      - name: Build UI
        run: npm run build --prefix agent/ui
      - name: Validate benchmark tasks
        run: python eval/run_eval.py --dry-run
      - name: Scan secrets
        run: python tools/check_secrets.py
      - name: Audit trace admission and release data
        run: |
          python tools/audit_trace_data.py
          python tools/audit_release_data.py
      - name: Check release versions and documentation
        run: python tools/check_release_consistency.py
